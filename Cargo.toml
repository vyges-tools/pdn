[package]
name = "vyges-pdn"
version = "0.1.0"
edition = "2021"
description = "Power distribution network generation over the OpenDB database: rings, straps, grids and their vias."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/pdn"

[dependencies]
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main", features = ["gen-write"] }
vyges-events = { git = "https://github.com/vyges-tools/events.git", branch = "main", default-features = false }
serde_json = "1"
# ⚠️ `-dont_use_vias` takes a REGEX by contract — `Connect::filterVias` runs `std::regex_search`
# over via names. Matching a subset of the syntax by hand would reject or admit vias the reference
# does not, silently. MIT/Apache-2.0, so within the licence policy.
regex = "1"

[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

[[bin]]
name = "vyges-pdn"
path = "src/main.rs"

[lib]
name = "vyges_pdn"
path = "src/lib.rs"
